[workspace]
resolver = "3"
members = [
    "easy-imgui-sys",
    "easy-imgui",
    "easy-imgui-renderer",
    "easy-imgui-window",
    "easy-imgui-filechooser",
    "easy-imgui-opengl",
    "easy-imgui-sdl3",
]

[workspace.package]
version = "0.25.0"
edition = "2024"
license = "MIT"
readme = "README.md"
repository = "https://github.com/rodrigorc/easy-imgui-rs"
categories = ["gui"]
keywords = ["imgui", "ui", "graphics"]

[workspace.dependencies]
easy-imgui-sys = { path = "easy-imgui-sys" }
easy-imgui = { path = "easy-imgui" }
easy-imgui-opengl = { path = "easy-imgui-opengl" }
easy-imgui-renderer = { path = "easy-imgui-renderer" }
easy-imgui-window = { path = "easy-imgui-window" }

anyhow = "1"
bitflags = "2"
cgmath = "0.18"
glow = "0.18"
image = "0.25"
log = "0.4"
send_wrapper = "0.6"
smallvec = "1.13"

