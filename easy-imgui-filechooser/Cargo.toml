[package]
name = "easy-imgui-filechooser"
description = "File-chooser widget for easy-imgui"
version = "0.6.0"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
tr = ["dep:tr", "dep:include-po"]
zip = ["dep:zip"]

[dependencies]
easy-imgui.workspace = true
image.workspace = true
bitflags.workspace = true

glob = "0.3"
time = { version = "0.3", features = ["macros", "formatting"] }
bytesize = "2"
tr = { version = "0.1.10", default-features = false, optional = true }
zip = { version = "9.5.0", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
easy-imgui-window = { workspace = true }
sys-locale = "0.3"

[build-dependencies]
include-po = { version = "0.2", optional = true }

[[example]]
name = "filechooser_demo"
required-features = ["zip"]
