[package]
name = "easy-imgui-sdl3"
description = "Binding of the SDL3+OpenGL3 Dear Imgui backends for the easy-imgui"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = []
freetype = ["easy-imgui/freetype"]

[dependencies]
easy-imgui-sys = { workspace = true, features = ["backend-opengl3", "backend-sdl3"] }
easy-imgui = { workspace = true, features = ["future"] }

# Ensure that sdl3 and easy-imgui-sys depend on the same version of sdl3-sys crate
sdl3 = "0.22.1"
glow.workspace = true
send_wrapper.workspace = true

[dev-dependencies]
smol = "2.0.2"
