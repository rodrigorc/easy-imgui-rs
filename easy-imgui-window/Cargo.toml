[package]
name = "easy-imgui-window"
description = "Default windowing for the easy-imgui crate using winit and easy-imgui-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[features]
default = ["clipboard", "main-window"]
clipboard = ["easy-imgui/clipboard"]
freetype = ["easy-imgui/freetype"]
main-window = ["dep:glutin-winit"]

[dependencies]
easy-imgui-sys.workspace = true
easy-imgui = { workspace = true, features = ["future"] }
easy-imgui-renderer.workspace = true

log.workspace = true
anyhow.workspace = true
bitflags.workspace = true
send_wrapper.workspace = true

glutin = "0.32"
glutin-winit = { version = "0.5", optional = true }
raw-window-handle = "0.6"
winit = { version = "0.30", features = ["x11", "mint"] }

# For the examples
[dev-dependencies]
simple_logger = "5"
gilrs = "0.11"
image.workspace = true
game-loop = { version = "=1.3", features = ["winit"] }
smol = "2.0.2"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
reqwest = "0.13"
env_logger = "0.11"

