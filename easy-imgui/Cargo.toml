[package]
name = "easy-imgui"
description = "Rust wrapper for the Dear ImGui library"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

[dependencies]
easy-imgui-sys.workspace = true
paste = "1"
bitflags.workspace = true
mint = "0.5"
cgmath = { workspace = true, features = ["mint"] }
image = { workspace = true, default-features = false }
log.workspace = true
either = "1.15.0"

send_wrapper = { workspace = true, optional = true }
futures-util = { version = "0.3.31", optional = true }
arboard = { version = "3.6.1", optional = true, default-features = false, features = ["wayland-data-control"] }

[features]
default = []
freetype = ["easy-imgui-sys/freetype"]
clipboard = ["dep:arboard"]
future = ["dep:send_wrapper", "dep:futures-util"]
